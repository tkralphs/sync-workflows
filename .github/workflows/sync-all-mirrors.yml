name: Sync All Mirrors

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - upstream: coin-or/CyLP
            mirror: tkralphs/CyLP
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/BLiMPy
            mirror: tkralphs/BLiMPy
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/GrUMPy
            mirror: tkralphs/GrUMPy
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/GiMPy
            mirror: tkralphs/GiMPy
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/CHiPPS-ALPS
            mirror: tkralphs/CHiPPS-ALPS
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/CHiPPS-BiCePS
            mirror: tkralphs/CHiPPS-BiCePS
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/CHiPPS-BLIS
            mirror: tkralphs/CHiPPS-BLIS
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/Dip
            mirror: tkralphs/Dip
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/CoinUtils
            mirror: tkralphs/CoinUtils
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/Osi
            mirror: tkralphs/Osi
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/Clp
            mirror: tkralphs/Clp
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/Cgl
            mirror: tkralphs/Cgl
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/Cbc
            mirror: tkralphs/Cbc
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/COIN-OR-OptimizationSuite
            mirror: tkralphs/COIN-OR-OptimizationSuite
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/MibS
            mirror: tkralphs/MibS
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/cylp-docker
            mirror: tkralphs/cylp-docker
            upstream_default: master
            mirror_default: master
          - upstream: coin-or/symphony-docker
            mirror: tkralphs/symphony-docker
            upstream_default: master
            mirror_default: master
      fail-fast: false

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.mirror }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ matrix.upstream }}.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream --tags

      - name: Sync default branch
        run: |
          git checkout ${{ matrix.mirror_default }}
          git reset --hard upstream/${{ matrix.upstream_default }}
          git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ matrix.mirror }} ${{ matrix.mirror_default }} --force

      - name: Sync all branches
        run: |
          for branch in $(git branch -r | grep upstream/ | grep -v HEAD | grep -v upstream/${{ matrix.upstream_default }}); do
            local_branch=${branch#upstream/}
            git checkout -B $local_branch $branch
            git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ matrix.mirror }} $local_branch --force
          done

      - name: Sync tags
        run: |
          git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ matrix.mirror }} --tags --force
